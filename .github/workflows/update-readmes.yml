name: Update Lab READMEs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readmes:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Download repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # Install Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ------------------------------------------------------
      # Generate READMEs
      # ------------------------------------------------------

      - name: Generate README files
        run: |
          python scripts/generate_readmes.py


      # ------------------------------------------------------
      # Commit generated changes
      # ------------------------------------------------------

      - name: Commit README changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add README.md

          git add TRYHACKME/README.md || true

          git add HACKTHEBOX/README.md || true

          git add LETSDEFEND/README.md || true

          git add OTHER/README.md || true


          if git diff --cached --quiet; then

            echo "No README changes."

          else

            git commit \
              -m "docs: update lab indexes"

            git push

          fi
